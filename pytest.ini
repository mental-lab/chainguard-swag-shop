[tool:pytest]
# Pytest configuration for Chainguard Swag Shop

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --junitxml=tests/pytest-report.xml
    --html=tests/pytest-report.html
    --self-contained-html
    --cov=.
    --cov-report=html:tests/htmlcov
    --cov-report=term-missing
    --cov-report=xml:tests/coverage.xml

# Minimum coverage percentage
[coverage:run]
source = .
omit =
    .venv/*
    tests/*
    __pycache__/*
    build/*
    .tox/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security-focused tests
    api: marks tests for API endpoints
    frontend: marks tests for frontend functionality    e2e: marks tests as end-to-end tests with Playwright
    smoke: marks tests as smoke tests (critical paths)
    visual: marks tests for visual regression testing
    performance: marks tests for performance testing

# Playwright-specific settings
[pytest-playwright]
# Default browser for E2E tests
browser = chromium

# Run in headless mode by default
headed = false

# Slow down operations (useful for debugging, ms)
slowmo = 0

# Screenshots on failure
screenshot = only-on-failure

# Video recording
video = retain-on-failure

# Tracing
trace = retain-on-failure

# Base URL can be overridden via --base-url CLI option
# base_url = http://localhost:8000
