{% extends 'base.html' %}

{% block title %}Home | Chainguard Swag Shop{% endblock %}

{% block content %}
<section class="hero">
    <div class="hero-content">
        <br><br><br><br>
        <a href="{{ url_for('products') }}" class="btn btn-primary">Shop Now</a>
    </div>
</section>

<section class="featured-products">
    <h2>Featured Products</h2>
    <div class="product-grid">
        {% for product in featured_products %}
            <div class="product-card">
                <img src="{{ product.image_url }}" alt="{{ product.name }}" onerror="this.onerror=null; this.src='/static/img/chainguard/product{{ (product.id % 6) if (product.id % 6) != 0 else 6 }}.svg'">
                <h3>{{ product.name }}</h3>
                <p class="price">${{ "%.2f"|format(product.price) }}</p>
                <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn btn-secondary">View Details</a>
            </div>
        {% endfor %}
    </div>
    <div class="view-all">
        <a href="{{ url_for('products') }}" class="btn btn-outline">View All Products</a>
    </div>
</section>
{% endblock %}
