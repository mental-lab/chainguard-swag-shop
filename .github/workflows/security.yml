name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read            # code-scanning wait-for-processing polls the run
  security-events: write
  pull-requests: write

jobs:
  # ── Build: compile-stage gate. The Dockerfile mounts a netrc build secret
  #    unconditionally; main pulls from public PyPI so an empty file
  #    satisfies the mount. ──
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pulling cgr.dev/vulnfreeish.dev/* requires registry auth. Pull token
      # (repository=oci, registry.pull on the org) stored as repo secrets —
      # starter orgs can't create assumable identities, so OIDC is out.
      - name: Docker login cgr.dev
        env:
          CHAINGUARD_REGISTRY_USER: ${{ secrets.CHAINGUARD_REGISTRY_USER }}
          CHAINGUARD_REGISTRY_TOKEN: ${{ secrets.CHAINGUARD_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CHAINGUARD_REGISTRY_TOKEN" ]; then
            echo "CHAINGUARD_REGISTRY_TOKEN secret required: this branch pulls cgr.dev/vulnfreeish.dev/*" >&2
            exit 1
          fi
          echo "$CHAINGUARD_REGISTRY_TOKEN" | docker login cgr.dev -u "$CHAINGUARD_REGISTRY_USER" --password-stdin

      - name: Build app image
        env:
          CHAINGUARD_NETRC: ${{ secrets.CHAINGUARD_NETRC }}
        run: |
          if [ -z "$CHAINGUARD_NETRC" ]; then
            echo "CHAINGUARD_NETRC secret required: this branch pulls from libraries.cgr.dev" >&2
            exit 1
          fi
          printf '%s' "$CHAINGUARD_NETRC" > netrc.ci
          docker build --secret id=netrc,src=netrc.ci -t swag-shop:ci .
          rm netrc.ci

      # The image is the OS story: this is where base-image CVEs show up
      # (or disappear, on the Chainguard branch). Runs here because the
      # image only exists on this runner — it is never pushed to a registry.
      - name: Image vulnerability scan (Trivy → JSON)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: swag-shop:ci
          format: json
          output: image-scan.json
          exit-code: "0"

      - name: Image scan summary
        if: always()
        run: |
          # tee: same markdown goes to the job summary and to a file the
          # sticky-PR-comment step below reads.
          {
            echo "## Image scan — swag-shop:ci"
            echo
            jq -r '
              ([.Results[].Vulnerabilities // [] | .[]]) as $v |
              "**\($v | length) findings** — " +
              (["CRITICAL","HIGH","MEDIUM","LOW"] | map(. as $sev | "\($sev): \($v | map(select(.Severity == $sev)) | length)") | join(" · "))
            ' image-scan.json
            echo
            echo "| Severity | Package | CVE | Installed | Fixed |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '
              [.Results[].Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL" or .Severity == "HIGH")] as $v
              | if ($v | length) == 0 then "| — | — | _no Critical/High findings_ | — | — |"
                else ($v[] | "| \(.Severity) | \(.PkgName) | \(.VulnerabilityID) | \(.InstalledVersion) | \(.FixedVersion // "—") |")
                end
            ' image-scan.json
          } | tee image-scan-summary.md >> "$GITHUB_STEP_SUMMARY"

      # GitLab-MR-widget equivalent: the OS/image findings inline on the PR,
      # updated in place on re-runs. This is where the Chainguard branch's
      # before/after diff becomes visible without opening any logs.
      - name: Comment image scan on PR (updates in place on re-run)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('image-scan-summary.md')) return;
            const marker = '<!-- image-scan -->';
            const body = marker + '\n' + fs.readFileSync('image-scan-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload image scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-scan
          path: image-scan.json

  # ── E2E: Playwright smoke tests against the freshly built container. ──
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Configure Chainguard Libraries auth
        env:
          CHAINGUARD_NETRC: ${{ secrets.CHAINGUARD_NETRC }}
        run: |
          if [ -z "$CHAINGUARD_NETRC" ]; then
            echo "CHAINGUARD_NETRC secret required: this branch pulls from libraries.cgr.dev" >&2
            exit 1
          fi
          printf '%s' "$CHAINGUARD_NETRC" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Install E2E deps
        env:
          PIP_INDEX_URL: https://libraries.cgr.dev/python-remediated/simple
          PIP_EXTRA_INDEX_URL: https://libraries.cgr.dev/python/simple
        run: |
          pip install -r requirements.txt -r requirements-e2e.txt
          playwright install --with-deps chromium

      - name: Docker login cgr.dev
        env:
          CHAINGUARD_REGISTRY_USER: ${{ secrets.CHAINGUARD_REGISTRY_USER }}
          CHAINGUARD_REGISTRY_TOKEN: ${{ secrets.CHAINGUARD_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CHAINGUARD_REGISTRY_TOKEN" ]; then
            echo "CHAINGUARD_REGISTRY_TOKEN secret required: this branch pulls cgr.dev/vulnfreeish.dev/*" >&2
            exit 1
          fi
          echo "$CHAINGUARD_REGISTRY_TOKEN" | docker login cgr.dev -u "$CHAINGUARD_REGISTRY_USER" --password-stdin

      - name: Start app container
        env:
          CHAINGUARD_NETRC: ${{ secrets.CHAINGUARD_NETRC }}
        run: |
          printf '%s' "$CHAINGUARD_NETRC" > netrc.ci
          docker build --secret id=netrc,src=netrc.ci -t swag-shop:ci .
          rm netrc.ci
          docker run -d --name app -p 8000:8000 \
            -e FLASK_ENV=production -e SECRET_KEY=test-secret-for-e2e \
            swag-shop:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/ >/dev/null && exit 0
            sleep 2
          done
          echo "App did not become healthy" >&2
          docker logs app
          exit 1

      - name: Smoke tests (headless Chromium)
        run: python -m pytest tests/e2e/test_smoke.py -v --browser chromium --base-url http://localhost:8000

      - name: App logs on failure
        if: failure()
        run: docker logs app

      - name: Stop app container
        if: always()
        run: docker rm -f app

  # ── Scan: Draugr orchestrates Trivy (SCA + IaC), Gitleaks, Semgrep into one
  #    SARIF report + one verdict. On PRs, "diff" mode posts a sticky
  #    new-vs-fixed comment and can fail on new findings only. ──
  scan:
    runs-on: ubuntu-latest
    # No `needs:` — the fs scan operates on the repo, not the image. Keeping
    # this independent means the advisor + gate still report the library
    # story even when the image build is blocked (e.g. Libraries auth not
    # yet provisioned).
    needs: []
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Draugr clones the saga's repository URL itself; give git the workflow
      # token so the clone of this private repo authenticates.
      - name: Authenticate git for the draugr clone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      # continue-on-error: on vulnerable main, findings are the expected
      # state — Draugr reports (SARIF + verdict) without breaking the job,
      # so the Grype scan still runs and the policy-gate stays the single
      # enforcement point.
      - name: Draugr security scan
        id: draugr
        uses: draugr-dev/draugr@facd7c5d7c6a55800ddca4bb41d47fd989faec71 # v0.72.0
        continue-on-error: true
        with:
          saga: draugr.saga.yaml
          tools: true            # provision cosign-verified scanners on the runner
          mode: auto             # diff on PRs (sticky new/fixed comment), scan otherwise
          fail-on: error
          output: draugr-out

      - name: Upload merged SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          sarif_file: ${{ steps.draugr.outputs.sarif }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Draugr security scan"
            echo
            [ -f draugr-out/report.md ] && cat draugr-out/report.md || echo "No markdown report produced — see the step logs."
          } >> "$GITHUB_STEP_SUMMARY"

      # Grype fs scan produces the JSON the OpenVEX advisor + Rego gate read.
      # Grype natively understands OpenVEX, so the image scan in
      # platform-build.yml can suppress findings Chainguard marked status=fixed.
      - name: Filesystem vulnerability scan (Grype → JSON)
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          path: .
          output-format: json
          output-file: results/fs-scan.json
          severity-cutoff: negligible
          fail-build: false

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-results
          path: results/

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Chainguard Libraries carries the +cgr.N backport builds; PyPI is the
      # fallback for everything else. Auth comes from ~/.netrc below.
      - name: Install deps
        env:
          PIP_INDEX_URL: https://libraries.cgr.dev/python-remediated/simple
          PIP_EXTRA_INDEX_URL: https://libraries.cgr.dev/python/simple
          CHAINGUARD_NETRC: ${{ secrets.CHAINGUARD_NETRC }}
        run: |
          if [ -z "$CHAINGUARD_NETRC" ]; then
            echo "CHAINGUARD_NETRC secret required: this branch pulls from libraries.cgr.dev" >&2
            exit 1
          fi
          printf '%s' "$CHAINGUARD_NETRC" > ~/.netrc
          chmod 600 ~/.netrc
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -v --ignore=tests/e2e

  # ── Advise: suture cross-references findings against Chainguard's OpenVEX
  #    feed and recommends the exact backport (incl. the same-version +cgr.N
  #    build no generic tool surfaces). ──
  remediation-advisor:
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scan-results
          path: results/

      - name: Install suture
        run: |
          curl -sSfL https://github.com/mental-lab/suture/releases/latest/download/suture_linux_amd64.tar.gz | tar xz suture
          sudo install suture /usr/local/bin/

      - name: Generate remediation recommendations from OpenVEX feed
        run: |
          suture advise \
            --scan-dir results/ \
            --assets security/asset-inventory.yaml \
            --format markdown --out vex-report.md
          # PRs get the sticky comment below; on pushes the job summary
          # carries the same content.

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Chainguard remediation advisor"
            echo
            [ -f vex-report.md ] && cat vex-report.md || echo "No advisor report produced — see the step logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post recommendation to PR (updates in place on re-run)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- remediation-advisor -->';
            const body = marker + '\n' + fs.readFileSync('vex-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

  # ── Gate: Conftest evaluates policy/vex/remediation.rego (scaffolded by
  #    `suture policy export`) against the scan. Pure Rego deny rules,
  #    fail-closed. ──
  policy-gate:
    runs-on: ubuntu-latest
    needs: [build, scan, unit-and-integration-tests, remediation-advisor]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The gate evaluates the IMAGE scan (what actually ships), not the
      # manifest scan: pip dist-info preserves the +cgr.N local segment, so
      # an applied backport reads as e.g. werkzeug 3.0.2+cgr.1 — while the
      # manifest scan strips it and can never prove the fix landed.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-scan
          path: results/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scan-results
          path: results/

      - name: Install Conftest (OPA) + yq + suture
        run: |
          CONFTEST_VERSION=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          curl -sSfL https://github.com/mental-lab/suture/releases/latest/download/suture_linux_amd64.tar.gz | tar xz suture
          sudo install suture /usr/local/bin/
          conftest --version && yq --version && suture --version

      - name: Fetch OpenVEX fix cache
        run: suture fetch --out data/vex-cache.json

      # Build the gate inputs with jq/yq:
      #   scan.json  Trivy image scan trimmed to the {Results:[...]} the Rego reads
      #   vex.json   fix cache nested under data.vex_cache
      #   assets.json  inventory nested under data.assets.assets
      - name: Reshape policy inputs (jq / yq)
        run: |
          mkdir -p policy-inputs
          if [ ! -f results/image-scan.json ]; then
            echo "image-scan.json missing — image build is a gate prerequisite (fail-closed)" >&2
            exit 1
          fi
          jq '{Results:[.Results[] | {Target, Vulnerabilities:
              ((.Vulnerabilities // []) | map({VulnerabilityID, Severity,
               PkgName, InstalledVersion}))}]}' \
            results/image-scan.json > policy-inputs/scan.json
          jq '{vex_cache: .}' data/vex-cache.json > policy-inputs/vex.json
          yq -o=json '{"assets": .}' security/asset-inventory.yaml > policy-inputs/assets.json

      - name: Policy gate — deny internet-facing Critical/High with a Chainguard fix
        run: |
          # --all-namespaces: conftest only evaluates the `main` package by
          # default; our policy is `package remediation`.
          set +e
          conftest test policy-inputs/scan.json \
            --policy policy/vex/remediation.rego \
            --data policy-inputs/assets.json \
            --data policy-inputs/vex.json \
            --all-namespaces | tee gate-output.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Policy gate"
            echo
            if [ "$status" -eq 0 ]; then
              echo ":white_check_mark: **ALLOWED** — no internet-facing Critical/High finding has an unapplied Chainguard fix."
            else
              echo ":no_entry: **DENIED** — remediation required before merge:"
            fi
            echo
            echo '```'
            cat gate-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
