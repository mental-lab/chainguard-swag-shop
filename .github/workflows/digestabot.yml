name: Digestabot — Auto-update image digests

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6am UTC
  workflow_dispatch:

permissions:
  id-token: write    # Required for OIDC auth with chainctl
  contents: write
  pull-requests: write

jobs:
  update-digests:
    name: Update image digests
    runs-on: ubuntu-latest

    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG || 'packetloss.network' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Authenticate with Chainguard so digestabot can pull the private org image
      # to resolve the latest digest. Skip gracefully if identity not configured.
      - name: Check required configuration
        id: check-config
        run: |
          if [ -z "${{ vars.CHAINGUARD_IDENTITY }}" ]; then
            echo "CHAINGUARD_IDENTITY not configured — skipping Chainguard auth."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup chainctl
        if: steps.check-config.outputs.skip == 'false'
        uses: chainguard-dev/setup-chainctl@f52718d822dc73d21a04ef2082822c4a203163b3 # v0.2.2
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      - name: Run digestabot
        id: digestabot
        uses: chainguard-dev/digestabot@afe360aa3b0c29d88844138e8fa0349384398967 # v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Compute chainctl image diff and post as a comment on the digestabot PR.
      # Requires chainctl to already be authenticated (setup-chainctl above).
      - name: Compute chainctl image diff
        id: chainctl_diff
        if: ${{ steps.digestabot.outputs.pull_request_number != '' }}
        shell: bash
        run: |
          processed_images='[]'
          echo 'body<<EOF' >> "${GITHUB_OUTPUT}"

          while read -r item; do
            image=$(jq -r '.image + "@" + .updated_digest' <<<"$item")
            old_image=$(jq -r '.image + "@" + .digest' <<<"$item")

            # Deduplicate by hashing the image+old_image pair
            image_pair_hash=$(sha256sum <<<"${image}${old_image}" | awk '{print $1}')
            if [[ $(jq -e ".[] | select(. == \"${image_pair_hash}\")" <<<"${processed_images}") ]]; then
              echo "Skipping ${image} — already processed"
              continue
            fi
            processed_images=$(jq -c ". += [\"${image_pair_hash}\"]" <<<"${processed_images}")

            echo "Computing diff for ${image}"
            chainctl_err=$(chainctl images diff "${old_image}" "${image}" -o json 2>&1) && diff="${chainctl_err}" || {
              echo "chainctl diff failed for ${image}:"
              echo "${chainctl_err}"
              continue
            }

            vulnerabilities_removed=$(jq '.diff.removed[].cve' <<<"${diff}" | wc -l)
            vulnerabilities_added=$(jq '.diff.added[].cve' <<<"${diff}" | wc -l)

            if [[ ${vulnerabilities_removed} -lt 1 ]]; then
              echo "No vulnerabilities removed for ${image}, skipping"
              continue
            fi

            image_name=$(jq -r '.image' <<<"$item")
            echo "## ${image_name}" >> "${GITHUB_OUTPUT}"
            echo "\`${image}\`" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            echo "**Vulnerabilities removed:** ${vulnerabilities_removed}" >> "${GITHUB_OUTPUT}"
            echo "**Vulnerabilities added:** ${vulnerabilities_added}" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"

            echo '<details>' >> "${GITHUB_OUTPUT}"
            echo '<summary><b>Removed CVEs</b></summary>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            removed_cves=$(jq -r '.diff.removed[] | "- [\(.cve)](https://nvd.nist.gov/vuln/detail/\(.cve)) (\(.severity))"' <<<"${diff}")
            [[ -n "${removed_cves}" ]] && echo "${removed_cves}" >> "${GITHUB_OUTPUT}" || echo "No CVEs removed" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            echo '</details>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"

            echo '<details>' >> "${GITHUB_OUTPUT}"
            echo '<summary><b>Added CVEs</b></summary>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            added_cves=$(jq -r '.diff.added[] | "- [\(.cve)](https://nvd.nist.gov/vuln/detail/\(.cve)) (\(.severity))"' <<<"${diff}")
            [[ -n "${added_cves}" ]] && echo "${added_cves}" >> "${GITHUB_OUTPUT}" || echo "No CVEs added" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            echo '</details>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"

            echo '<details>' >> "${GITHUB_OUTPUT}"
            echo '<summary><b>Removed Packages</b></summary>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            removed_pkgs=$(jq -r '.diff.removed_packages[] | "- \(.name) (\(.version)): \(.purl)"' <<<"${diff}")
            [[ -n "${removed_pkgs}" ]] && echo "${removed_pkgs}" >> "${GITHUB_OUTPUT}" || echo "No packages removed" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            echo '</details>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"

            echo '<details>' >> "${GITHUB_OUTPUT}"
            echo '<summary><b>Added Packages</b></summary>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            added_pkgs=$(jq -r '.diff.added_packages[] | "- \(.name) (\(.version)): \(.purl)"' <<<"${diff}")
            [[ -n "${added_pkgs}" ]] && echo "${added_pkgs}" >> "${GITHUB_OUTPUT}" || echo "No packages added" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            echo '</details>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"

            echo '<details>' >> "${GITHUB_OUTPUT}"
            echo '<summary><b>Changed Packages</b></summary>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            changed_pkgs=$(jq -r '.diff.changed_packages[] | "- \(.name): \(.old_version) -> \(.new_version): \(.purl)"' <<<"${diff}")
            [[ -n "${changed_pkgs}" ]] && echo "${changed_pkgs}" >> "${GITHUB_OUTPUT}" || echo "No packages changed" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"
            echo '</details>' >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_OUTPUT}"

          done < <(jq -c '.updates // [] | .[]' <<<'${{ steps.digestabot.outputs.json }}')

          echo 'EOF' >> "${GITHUB_OUTPUT}"

      - uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find_comment
        if: ${{ steps.digestabot.outputs.pull_request_number != '' }}
        with:
          issue-number: ${{ steps.digestabot.outputs.pull_request_number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Chainctl Image Diff'

      - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: ${{ steps.digestabot.outputs.pull_request_number != '' }}
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ steps.digestabot.outputs.pull_request_number }}
          body: |
            ## Chainctl Image Diff
            ${{ steps.chainctl_diff.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          edit-mode: replace
