name: dependency-review

# GitHub-native equivalent of GitLab's MR security widget "did this change
# introduce a vulnerable dependency?" loop. Zero custom code: the action is
# maintained by GitHub and reads the dependency graph + GitHub Advisory DB.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the PR if it INTRODUCES a High/Critical vulnerable dependency.
          fail-on-severity: high
          # Render a summary into the job + optionally a PR comment.
          comment-summary-in-pr: always
          # License policy can be layered here too (deny-licenses).
