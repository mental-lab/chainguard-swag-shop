name: Platform Build — Custom Assembly + Evidence Bundle

on:
  push:
    paths:
      - ca-images-iac/**
      - certs/**
      - .github/workflows/platform-build.yml
  workflow_dispatch:

# Least privilege at the top; the pipeline job widens only what it needs.
permissions: {}

env:
  # Global CA certificate directory — scanned for every image build. These are
  # the org's internal/private CAs, applied uniformly, not a per-image setting.
  CERTS_DIR: certs

jobs:
  # ── Discover — one matrix entry per image directory ──
  # Each image is a directory: ca-images-iac/<repo>/ containing
  #   <repo>.yaml — pure Custom Assembly config (sent to chainctl)   [required]
  #   meta.yaml   — provenance/pin routing (dockerfile)              [optional]
  # Every image with a <repo>.yaml is built. `dockerfile` (from meta.yaml, "" if
  # absent) tells the pipeline whether to also verify + pin that image. The
  # pipeline job runs once PER IMAGE, fully isolated, so one image failing
  # never blocks another. If the org isn't configured or no images exist, the
  # matrix is empty and the pipeline is skipped.
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Build matrix from ca-images-iac/
        id: set
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Guard — skip gracefully if Chainguard org is not configured.
          # Set CHAINGUARD_ORG and CHAINGUARD_IDENTITY in repo Settings → Variables
          # and configure an assumable OIDC identity in your Chainguard organization.
          if [ -z "${{ vars.CHAINGUARD_ORG }}" ] || [ -z "${{ vars.CHAINGUARD_IDENTITY }}" ]; then
            echo "CHAINGUARD_ORG or CHAINGUARD_IDENTITY not configured — skipping build."
            echo "See: https://edu.chainguard.dev/chainguard/administration/iam-organizations/assumable-ids/identity-examples/github-actions-identity/"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # repo = directory name, config = <repo>.yaml. dockerfile comes from
          # meta.yaml (empty when absent → build-only, no verify/pin).
          entries=()
          for dir in ca-images-iac/*/; do
            repo=$(basename "$dir")
            config="${dir}${repo}.yaml"
            meta="${dir}meta.yaml"
            if [ ! -f "$config" ]; then echo "::warning::$dir has no ${repo}.yaml — skipping."; continue; fi
            df=""
            [ -f "$meta" ] && df=$(yq -r '.dockerfile // ""' "$meta")
            entries+=( "$(jq -nc --arg repo "$repo" --arg config "$config" --arg df "$df" \
                          '{repo: $repo, config: $config, dockerfile: $df}')" )
          done

          if [ ${#entries[@]} -eq 0 ]; then
            echo "No valid image directories under ca-images-iac/ — nothing to build."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INCLUDE=$(printf '%s\n' "${entries[@]}" | jq -s -c '{include: .}')
          echo "Discovered images:"
          echo "$INCLUDE" | jq -r '.include[] | "  - \(.repo)  build=\(.config)  pin=\(if .dockerfile == "" then "no" else .dockerfile end)"'
          echo "matrix=$INCLUDE" >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════════════
  # PER-IMAGE PIPELINE — runs once per image, isolated (fail-fast: false).
  # Each image flows through three phases in sequence:
  #   1. BUILD            — apply config (+ certs), wait for the build
  #   2. IMAGE PROVENANCE — (if it opts into pinning and the digest changed)
  #                         verify signature, SBOM, SLSA, Grype, evidence bundle
  #   3. UPDATE DIGEST    — pin the Dockerfile FROM and open a PR
  # Because every image has its own job, a slow or failing image (e.g. a build
  # timeout) only fails its own pipeline — others build, verify and pin normally.
  # ════════════════════════════════════════════════════════════════════
  pipeline:
    name: Pipeline — ${{ matrix.repo }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the digest-update branch
      pull-requests: write   # open the PR
      id-token: write        # OIDC auth with chainctl
    strategy:
      fail-fast: false       # one image failing must not cancel the others
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG || 'packetloss.network' }}
      CHAINGUARD_REPO: ${{ matrix.repo }}
      CONFIG_FILE: ${{ matrix.config }}        # pure Custom Assembly config
      DOCKERFILE: ${{ matrix.dockerfile }}     # "" → build-only (no verify/pin)
      # CERTS_DIR is global (workflow-level env), not per-image.

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      # ── PHASE 1 — BUILD ──────────────────────────────────────────────
      # Build the invocation dynamically: start from the image's Custom Assembly
      # config and append one `--with-certificates=<file>` flag per CA certificate
      # found under $CERTS_DIR. `build apply` is async and returns no digest, so
      # we snapshot existing build report IDs to identify the build(s) it triggers.
      - name: Build — apply config + certificates
        id: customize
        run: |
          set -euo pipefail

          ARGS=(
            images repos build apply
            --parent "$CHAINGUARD_ORG"
            --repo   "$CHAINGUARD_REPO"
            --file   "$CONFIG_FILE"
            --yes
          )

          # Discover additional CA certificates and add a flag for each.
          CERT_COUNT=0
          if [ -n "$CERTS_DIR" ] && [ -d "$CERTS_DIR" ]; then
            while IFS= read -r -d '' cert; do
              echo "Adding CA certificate: $cert"
              ARGS+=( "--with-certificates=$cert" )
              CERT_COUNT=$((CERT_COUNT + 1))
            done < <(find "$CERTS_DIR" -type f \
                        \( -iname '*.pem' -o -iname '*.crt' -o -iname '*.cer' -o -iname '*.ca' \) \
                        -print0 | sort -z)
          else
            echo "No certificate directory '${CERTS_DIR:-<none>}' — building without extra CAs."
          fi
          echo "Found $CERT_COUNT additional CA certificate(s)."

          # Snapshot existing report IDs so the wait step can identify this apply's build(s).
          BEFORE_IDS=$(chainctl images repos build list \
            --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
            --output json 2>/dev/null | jq -c '[.reports[].id]')
          echo "before_ids=$BEFORE_IDS" >> "$GITHUB_OUTPUT"

          set +e
          APPLY_OUT=$(chainctl "${ARGS[@]}" 2>&1)
          APPLY_RC=$?
          set -e
          echo "$APPLY_OUT"
          if [ "$APPLY_RC" -ne 0 ]; then
            echo "Error: chainctl build apply exited with code $APPLY_RC." >&2
            exit "$APPLY_RC"
          fi

          if echo "$APPLY_OUT" | grep -q "No changes detected"; then
            echo "Image already up to date — no new build triggered."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # Wait for the triggered build(s) to finish and fail if any did not
      # succeed. Identifies them as report IDs absent before the apply, so
      # concurrent/historical builds don't confuse completion detection.
      - name: Build — wait for completion
        if: steps.customize.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          BEFORE_IDS='${{ steps.customize.outputs.before_ids }}'

          list_reports() {
            chainctl images repos build list \
              --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
              --output json 2>/dev/null
          }

          echo "Waiting for custom build(s) of '$CHAINGUARD_REPO' to complete..."
          DEADLINE=$(( $(date +%s) + 600 ))   # 10 minute budget
          while :; do
            NEW=$(list_reports | jq -c --argjson before "$BEFORE_IDS" \
                    '[.reports[] | select((.id as $i | $before | index($i)) | not)]')
            TOTAL=$(echo "$NEW"   | jq 'length')
            PENDING=$(echo "$NEW" | jq '[.[] | select(.result == null)] | length')
            echo "  triggered reports: total=$TOTAL pending=$PENDING"

            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Error: timed out after 10m waiting for build(s)." >&2
              echo "$NEW" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result // "pending")"' >&2
              exit 1
            fi
            sleep 20
          done

          FAILED=$(echo "$NEW" | jq -c '[.[] | select(.result != "Success")]')
          if [ "$(echo "$FAILED" | jq 'length')" -ne 0 ]; then
            echo "Error: one or more triggered builds of '$CHAINGUARD_REPO' did not succeed:" >&2
            echo "$FAILED" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result)"' >&2
            echo "Log of most recent failed attempt:" >&2
            echo "$FAILED" | jq -r 'sort_by(.completedAt) | last | .log' | tail -c 3000 >&2
            exit 1
          fi
          echo "All triggered builds of '$CHAINGUARD_REPO' completed successfully."

      # ── PHASE 2 — IMAGE PROVENANCE ───────────────────────────────────
      # Only for images that opt into pinning (DOCKERFILE set). Resolve the live
      # digest the Dockerfile consumes; the verify steps run only if it changed.
      - name: Provenance — resolve consumed digest
        id: resolve
        if: env.DOCKERFILE != ''
        uses: ./.github/actions/resolve-consumed-digest
        with:
          repo: ${{ matrix.repo }}
          dockerfile: ${{ matrix.dockerfile }}

      - name: Provenance — verify image signature (cosign)
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        run: |
          mkdir -p evidence
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ steps.resolve.outputs.image_ref }}@${{ steps.resolve.outputs.digest }} \
            | jq . > evidence/signature-verify.json
          echo "Signature verified"

      - name: Provenance — extract SBOM attestation
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        run: |
          cosign verify-attestation \
            --type sbom \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ steps.resolve.outputs.image_ref }}@${{ steps.resolve.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson | .predicate' \
            > evidence/sbom.json
          echo "SBOM extracted: $(jq '.packages | length' evidence/sbom.json) packages"

      - name: Provenance — extract SLSA provenance
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ steps.resolve.outputs.image_ref }}@${{ steps.resolve.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson' \
            > evidence/provenance.json
          echo "Provenance extracted"

      - name: Provenance — Grype vulnerability scan
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        uses: chainguard-actions/anchore-scan-action@5470f64f241ff0b662c1efed80f982517e2340d6 # v7.4.0
        env:
          GRYPE_DB_AUTO_UPDATE: "true"
        with:
          image: ${{ steps.resolve.outputs.image_ref }}@${{ steps.resolve.outputs.digest }}
          #Temp disable due to Critical CVE in Python
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: evidence/grype-results.json

      - name: Provenance — add build config to evidence bundle
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        run: |
          CONFIG="ca-images-iac/${{ matrix.repo }}/${{ matrix.repo }}.yaml"
          [ -f "$CONFIG" ] && cp "$CONFIG" evidence/ || echo "No overlay config found at $CONFIG — skipping."

      - name: Provenance — upload evidence bundle
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        uses: chainguard-actions/actions-upload-artifact@8dd583ff8251c4a96857f05031036783608a6a96 # v7.0.1
        with:
          name: evidence-bundle-${{ matrix.repo }}-${{ github.sha }}
          retention-days: 90
          path: evidence/

      # ── PHASE 3 — UPDATE DIGEST ──────────────────────────────────────
      # Pin the Dockerfile FROM to the verified digest and open a PR. Reached
      # only after provenance passed (Grype gates the job), and only when the
      # digest actually changed.
      - name: Update digest — pin Dockerfile
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          # Repin only the FROM line that references THIS image, so a Dockerfile
          # with multiple cgr.dev bases isn't clobbered.
          sed -i "s|FROM ${IMAGE_REF}\(:[^ @]*\)\?\(@sha256:[a-f0-9]*\)\?|FROM ${IMAGE_REF}:${IMAGE_TAG}@${DIGEST}|" "$DOCKERFILE"
          echo "Updated $DOCKERFILE to digest: $DIGEST"

      - name: Update digest — open PR
        if: env.DOCKERFILE != '' && steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ${{ matrix.repo }} image digest [${{ github.sha }}]"
          title: "chore: update ${{ matrix.repo }} custom assembly image digest"
          body: |
            Automated digest update from Custom Assembly build.

            **Image:** `${{ steps.resolve.outputs.image_ref }}:${{ steps.resolve.outputs.tag }}`
            **Build:** ${{ github.run_id }}
            **Digest:** `${{ steps.resolve.outputs.digest }}`
            **Signed:** cosign verified ✓
            **Evidence bundle:** attached to this workflow run (90-day retention)

            Triggered by: change under `ca-images-iac/`
          branch: chore/update-${{ matrix.repo }}-digest
          delete-branch: true
