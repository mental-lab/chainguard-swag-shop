name: Platform Build — Custom Assembly + Evidence Bundle

on:
  push:
    paths:
      - build.yaml
      - .github/workflows/platform-build.yml
  workflow_dispatch:

permissions:
  id-token: write       # Required for OIDC auth with chainctl
  contents: write       # Push the digest-update branch
  pull-requests: write  # Required for create-pull-request to open the PR

jobs:
  build-and-verify:
    name: Build, Scan, Attest, Bundle
    runs-on: ubuntu-latest

    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG || 'packetloss.network' }}
      CHAINGUARD_REPO: python
      IMAGE_REF: cgr.dev/${{ vars.CHAINGUARD_ORG || 'packetloss.network' }}/python
      IMAGE_TAG: 3.12-dev   # tag the application consumes; pinned by digest below
      CERTS_DIR: certs        # directory scanned for additional CA certificates

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ── 0. Guard — skip gracefully if Chainguard org is not configured ──
      # Set CHAINGUARD_ORG and CHAINGUARD_IDENTITY in repo Settings → Variables
      # and configure an assumable OIDC identity in your Chainguard organization.
      - name: Check required configuration
        id: check-config
        run: |
          if [ -z "${{ vars.CHAINGUARD_ORG }}" ] || [ -z "${{ vars.CHAINGUARD_IDENTITY }}" ]; then
            echo "CHAINGUARD_ORG or CHAINGUARD_IDENTITY not configured — skipping build."
            echo "See: https://edu.chainguard.dev/chainguard/administration/iam-organizations/assumable-ids/identity-examples/github-actions-identity/"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── 1. Authenticate with Chainguard (OIDC — no long-lived credentials) ──
      - name: Setup chainctl
        if: steps.check-config.outputs.skip == 'false'
        uses: chainguard-dev/setup-chainctl@f52718d822dc73d21a04ef2082822c4a203163b3 # v0.2.2
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      # ── 2a. Customize image — apply config + certificates ──
        # Builds the chainctl invocation dynamically: starts from the base
        # config file, then appends one `--with-certificates=<file>` flag for
        # every CA certificate found under $CERTS_DIR. `build apply` only prints
        # a config diff and starts an async build — it returns no digest — so we
        # snapshot the existing build reports here to identify the ones this
        # apply triggers (tracked in step 2b).
      - name: Customize image (apply config + certificates)
        if: steps.check-config.outputs.skip == 'false'
        id: customize
        run: |
          set -euo pipefail

          ARGS=(
            images repos build apply
            --parent "$CHAINGUARD_ORG"
            --repo   "$CHAINGUARD_REPO"
            --file   build.yaml
            --yes
          )

          # Discover additional CA certificates and add a flag for each.
          CERT_COUNT=0
          if [ -d "$CERTS_DIR" ]; then
            while IFS= read -r -d '' cert; do
              echo "Adding CA certificate: $cert"
              ARGS+=( "--with-certificates=$cert" )
              CERT_COUNT=$((CERT_COUNT + 1))
            done < <(find "$CERTS_DIR" -type f \
                        \( -iname '*.pem' -o -iname '*.crt' -o -iname '*.cer' -o -iname '*.ca' \) \
                        -print0 | sort -z)
          else
            echo "No certificate directory '$CERTS_DIR' found — building without extra CAs."
          fi
          echo "Found $CERT_COUNT additional CA certificate(s)."
          echo "cert_count=$CERT_COUNT" >> "$GITHUB_OUTPUT"

          # Snapshot existing build report IDs so the next step can identify the
          # build(s) this apply triggers (one report per published variant).
          BEFORE_IDS=$(chainctl images repos build list \
            --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
            --output json 2>/dev/null | jq -c '[.reports[].id]')
          echo "before_ids=$BEFORE_IDS" >> "$GITHUB_OUTPUT"

          # Apply config + certificates (triggers the async build).
          set +e
          APPLY_OUT=$(chainctl "${ARGS[@]}" 2>&1)
          APPLY_RC=$?
          set -e
          echo "$APPLY_OUT"
          if [ "$APPLY_RC" -ne 0 ]; then
            echo "Error: chainctl build apply exited with code $APPLY_RC." >&2
            exit "$APPLY_RC"
          fi

          if echo "$APPLY_OUT" | grep -q "No changes detected"; then
            echo "Image already up to date — no new build needed."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2b. Check build status — wait for the triggered build(s) and gate on
      #        the variant that backs the tag we consume (IMAGE_TAG). ──
      - name: Check build status
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        id: build-status
        run: |
          set -euo pipefail
          BEFORE_IDS='${{ steps.customize.outputs.before_ids }}'

          list_reports() {
            chainctl images repos build list \
              --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
              --output json 2>/dev/null
          }

          # Identify which build backs the tag we consume. One apply rebuilds
          # every Python version variant (3.10…3.14); the report whose
          # annotation dev.chainguard.package.main = "python-<ver>" is the one
          # that produces the ${IMAGE_TAG} image. Floating tags (latest,
          # latest-dev) have no fixed version, so we fall back to requiring any
          # triggered build to succeed.
          VER=$(printf '%s' "$IMAGE_TAG" | grep -oE '^[0-9]+\.[0-9]+' || true)
          TARGET_MAIN=""
          if [ -n "$VER" ]; then
            TARGET_MAIN="python-$VER"
            echo "Gating on build variant '$TARGET_MAIN' (backs tag '$IMAGE_TAG')."
          else
            echo "Tag '$IMAGE_TAG' is not version-specific; gating on any triggered build."
          fi

          # Wait for the triggered build(s) to complete. We identify them as
          # report IDs that did not exist before the apply, so concurrent or
          # historical builds don't confuse completion detection.
          echo "Waiting for custom build(s) to complete..."
          DEADLINE=$(( $(date +%s) + 600 ))   # 10 minute budget
          while :; do
            NEW=$(list_reports | jq -c --argjson before "$BEFORE_IDS" \
                    '[.reports[] | select((.id as $i | $before | index($i)) | not)]')
            TOTAL=$(echo "$NEW"   | jq 'length')
            PENDING=$(echo "$NEW" | jq '[.[] | select(.result == null)] | length')
            echo "  triggered reports: total=$TOTAL pending=$PENDING"

            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Error: timed out after 10m waiting for build(s)." >&2
              echo "$NEW" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result // "pending")"' >&2
              exit 1
            fi
            sleep 20
          done

          # Decide pass/fail from the build that backs our tag, and surface
          # that build's log on failure (not some other variant's).
          if [ -n "$TARGET_MAIN" ]; then
            TARGET=$(echo "$NEW" | jq -c --arg m "$TARGET_MAIN" \
                       '[.[] | select((.config|fromjson).annotations["dev.chainguard.package.main"] == $m)]')
          else
            TARGET="$NEW"
          fi
          if [ "$(echo "$TARGET" | jq 'length')" -eq 0 ]; then
            echo "Error: no build report found for '${TARGET_MAIN:-any variant}' among triggered builds." >&2
            echo "$NEW" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result)"' >&2
            exit 1
          fi
          if [ "$(echo "$TARGET" | jq '[.[] | select(.result == "Success")] | length')" -eq 0 ]; then
            echo "Error: the build backing '${TARGET_MAIN:-tag $IMAGE_TAG}' did not succeed. Log of most recent attempt:" >&2
            echo "$TARGET" | jq -r 'sort_by(.completedAt) | last | .log' | tail -c 3000 >&2
            exit 1
          fi
          echo "Build backing '${TARGET_MAIN:-tag $IMAGE_TAG}' completed successfully."

      # ── 2c. Get updated digest — resolve the digest of the tag the
      #        application consumes (the tag is the source of truth). ──
      - name: Get updated image digest
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        id: build
        run: |
          set -euo pipefail
          echo "Resolving digest for tag '${IMAGE_TAG}' ..."
          DIGEST=""
          for attempt in 1 2 3 4 5 6; do
            DIGEST=$(chainctl images list \
                       --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
                       --output json 2>/dev/null \
                     | jq -r --arg t "$IMAGE_TAG" \
                         'first(.[0].tags[]? | select(.name == $t) | .digest) // empty')
            [ -n "$DIGEST" ] && break
            echo "  tag '${IMAGE_TAG}' not resolvable yet (attempt $attempt) — retrying in 10s..."
            sleep 10
          done
          if [ -z "$DIGEST" ]; then
            echo "Error: could not resolve digest for tag '${IMAGE_TAG}'." >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved image digest: $DIGEST"

      # ── 3. Verify image is cryptographically signed ──
      - name: Verify image signature (cosign)
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        run: |
          mkdir -p evidence
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }} \
            | jq . > evidence/signature-verify.json
          echo "Signature verified"

      # ── 4. Extract SBOM ──
      - name: Extract SBOM attestation
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        run: |
          cosign verify-attestation \
            --type sbom \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson | .predicate' \
            > evidence/sbom.json
          echo "SBOM extracted: $(jq '.packages | length' evidence/sbom.json) packages"

      # ── 5. Extract SLSA provenance ──
      - name: Extract SLSA provenance
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson' \
            > evidence/provenance.json
          echo "Provenance extracted"

      # ── 6. Grype scan — fail on critical or high CVEs ──
      - name: Grype vulnerability scan
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        env:
          GRYPE_DB_AUTO_UPDATE: "true"   # default true; v7.4.0 bundles grype
                                         # v0.110 using the current (v6) DB schema
        with:
          image: ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: evidence/grype-results.json

      # ── 7. Copy build config into evidence bundle ──
      - name: Add build config to evidence bundle
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        run: cp build.yaml evidence/build.yaml

      # ── 8. Upload evidence bundle as Actions artifact ──
      - name: Upload evidence bundle
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-bundle-${{ github.sha }}
          retention-days: 90
          path: evidence/

      # ── 9. Update Dockerfile with new pinned digest ──
      - name: Update Dockerfile digest
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          sed -i "s|FROM cgr.dev/[^ ]*|FROM ${{ env.IMAGE_REF }}:${{ env.IMAGE_TAG }}@${DIGEST}|" Dockerfile
          echo "Updated Dockerfile to digest: $DIGEST"

      - name: Open PR with updated digest
        if: steps.check-config.outputs.skip == 'false' && steps.customize.outputs.skipped != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update swag-shop image digest [${{ github.sha }}]"
          title: "chore: update custom assembly image digest"
          body: |
            Automated digest update from Custom Assembly build.

            **Build:** ${{ github.run_id }}
            **Digest:** `${{ steps.build.outputs.digest }}`
            **Grype:** 0 critical, 0 high CVEs ✓
            **Signed:** cosign verified ✓
            **Evidence bundle:** attached to this workflow run (90-day retention)

            Triggered by: change to `build.yaml`
          branch: chore/update-image-digest
          delete-branch: true
