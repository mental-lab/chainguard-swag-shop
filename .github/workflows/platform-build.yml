name: Platform Build — Custom Assembly + Evidence Bundle

on:
  push:
    paths:
      - ca-images-iac/**
      - .github/workflows/platform-build.yml
  workflow_dispatch:

permissions:
  id-token: write       # Required for OIDC auth with chainctl
  contents: write       # Push the digest-update branch
  pull-requests: write  # Required for create-pull-request to open the PR

jobs:
  # ── Discover — build the image matrix from ca-images-iac/*/*.yaml ──
  # Each overlay file carries an `x-meta` block (repo/tag/dockerfile/certs_dir).
  # We read those into a matrix so the build job runs once per image, in
  # parallel. If the Chainguard org/identity isn't configured, or no overlay
  # files exist, we emit an empty matrix and the build job skips gracefully.
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Build matrix from ca-images-iac/
        id: set
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Guard — skip gracefully if Chainguard org is not configured.
          # Set CHAINGUARD_ORG and CHAINGUARD_IDENTITY in repo Settings → Variables
          # and configure an assumable OIDC identity in your Chainguard organization.
          if [ -z "${{ vars.CHAINGUARD_ORG }}" ] || [ -z "${{ vars.CHAINGUARD_IDENTITY }}" ]; then
            echo "CHAINGUARD_ORG or CHAINGUARD_IDENTITY not configured — skipping build."
            echo "See: https://edu.chainguard.dev/chainguard/administration/iam-organizations/assumable-ids/identity-examples/github-actions-identity/"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Each image lives in its own directory: ca-images-iac/<image>/<image>.yaml
          files=(ca-images-iac/*/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No overlay files found under ca-images-iac/*/ — nothing to build."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One matrix entry per overlay file: read its x-meta block as JSON and
          # attach the file path under `config`.
          INCLUDE=$(
            for f in "${files[@]}"; do
              yq -o=json -I=0 '.["x-meta"]' "$f" \
                | jq -c --arg c "$f" '. + {config: $c}'
            done | jq -s -c '{include: .}'
          )
          echo "Discovered images:"
          echo "$INCLUDE" | jq -r '.include[] | "  - \(.repo):\(.tag)  (\(.config))"'
          echo "matrix=$INCLUDE" >> "$GITHUB_OUTPUT"

  build-and-verify:
    name: Build ${{ matrix.repo }}:${{ matrix.tag }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one image failing must not cancel the others
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG || 'packetloss.network' }}
      CHAINGUARD_REPO: ${{ matrix.repo }}
      IMAGE_REF: cgr.dev/${{ vars.CHAINGUARD_ORG || 'packetloss.network' }}/${{ matrix.repo }}
      IMAGE_TAG: ${{ matrix.tag }}
      CONFIG_FILE: ${{ matrix.config }}        # overlay file (includes x-meta)
      DOCKERFILE: ${{ matrix.dockerfile }}     # Dockerfile to pin ("" to skip)
      CERTS_DIR: ${{ matrix.certs_dir }}       # cert scan dir ("" to skip)

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      # ── 1. Authenticate with Chainguard (OIDC — no long-lived credentials) ──
      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      # ── 2a. Customize image — apply config + certificates ──
        # Strips the x-meta routing block out of the overlay (chainctl only
        # wants apko config), then builds the chainctl invocation dynamically:
        # starts from the cleaned config file and appends one
        # `--with-certificates=<file>` flag for every CA certificate found under
        # $CERTS_DIR. `build apply` only prints a config diff and starts an async
        # build — it returns no digest — so we snapshot the existing build
        # reports here to identify the ones this apply triggers (tracked in 2b).
      - name: Customize image (apply config + certificates)
        id: customize
        run: |
          set -euo pipefail

          # Strip the workflow-only x-meta block; hand chainctl pure apko config.
          APPLY_FILE="$(mktemp --suffix=.yaml)"
          yq 'del(.["x-meta"])' "$CONFIG_FILE" > "$APPLY_FILE"

          ARGS=(
            images repos build apply
            --parent "$CHAINGUARD_ORG"
            --repo   "$CHAINGUARD_REPO"
            --file   "$APPLY_FILE"
            --yes
          )

          # Discover additional CA certificates and add a flag for each.
          CERT_COUNT=0
          if [ -n "$CERTS_DIR" ] && [ -d "$CERTS_DIR" ]; then
            while IFS= read -r -d '' cert; do
              echo "Adding CA certificate: $cert"
              ARGS+=( "--with-certificates=$cert" )
              CERT_COUNT=$((CERT_COUNT + 1))
            done < <(find "$CERTS_DIR" -type f \
                        \( -iname '*.pem' -o -iname '*.crt' -o -iname '*.cer' -o -iname '*.ca' \) \
                        -print0 | sort -z)
          else
            echo "No certificate directory '${CERTS_DIR:-<none>}' — building without extra CAs."
          fi
          echo "Found $CERT_COUNT additional CA certificate(s)."
          echo "cert_count=$CERT_COUNT" >> "$GITHUB_OUTPUT"

          # Snapshot existing build report IDs so the next step can identify the
          # build(s) this apply triggers (one report per published variant).
          BEFORE_IDS=$(chainctl images repos build list \
            --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
            --output json 2>/dev/null | jq -c '[.reports[].id]')
          echo "before_ids=$BEFORE_IDS" >> "$GITHUB_OUTPUT"

          # Apply config + certificates (triggers the async build).
          set +e
          APPLY_OUT=$(chainctl "${ARGS[@]}" 2>&1)
          APPLY_RC=$?
          set -e
          echo "$APPLY_OUT"
          if [ "$APPLY_RC" -ne 0 ]; then
            echo "Error: chainctl build apply exited with code $APPLY_RC." >&2
            exit "$APPLY_RC"
          fi

          if echo "$APPLY_OUT" | grep -q "No changes detected"; then
            echo "Image already up to date — no new build needed."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2b. Check build status — wait for the triggered build(s) to finish and
      #        fail if any of them did not succeed. ──
      - name: Check build status
        if: steps.customize.outputs.skipped != 'true'
        id: build-status
        run: |
          set -euo pipefail
          BEFORE_IDS='${{ steps.customize.outputs.before_ids }}'

          list_reports() {
            chainctl images repos build list \
              --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
              --output json 2>/dev/null
          }

          # Wait for the triggered build(s) to complete. We identify them as
          # report IDs that did not exist before the apply, so concurrent or
          # historical builds don't confuse completion detection.
          echo "Waiting for custom build(s) of '$CHAINGUARD_REPO' to complete..."
          DEADLINE=$(( $(date +%s) + 600 ))   # 10 minute budget
          while :; do
            NEW=$(list_reports | jq -c --argjson before "$BEFORE_IDS" \
                    '[.reports[] | select((.id as $i | $before | index($i)) | not)]')
            TOTAL=$(echo "$NEW"   | jq 'length')
            PENDING=$(echo "$NEW" | jq '[.[] | select(.result == null)] | length')
            echo "  triggered reports: total=$TOTAL pending=$PENDING"

            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Error: timed out after 10m waiting for build(s)." >&2
              echo "$NEW" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result // "pending")"' >&2
              exit 1
            fi
            sleep 20
          done

          # Require every triggered build to succeed. (One apply may rebuild
          # several version variants of this repo; any failure fails the run and
          # surfaces that build's log.)
          FAILED=$(echo "$NEW" | jq -c '[.[] | select(.result != "Success")]')
          if [ "$(echo "$FAILED" | jq 'length')" -ne 0 ]; then
            echo "Error: one or more triggered builds of '$CHAINGUARD_REPO' did not succeed:" >&2
            echo "$FAILED" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result)"' >&2
            echo "Log of most recent failed attempt:" >&2
            echo "$FAILED" | jq -r 'sort_by(.completedAt) | last | .log' | tail -c 3000 >&2
            exit 1
          fi
          echo "All triggered builds of '$CHAINGUARD_REPO' completed successfully."

      # ── 2c. Get updated digest — resolve the digest of the tag the
      #        application consumes (the tag is the source of truth). ──
      - name: Get updated image digest
        if: steps.customize.outputs.skipped != 'true'
        id: build
        run: |
          set -euo pipefail
          echo "Resolving digest for tag '${IMAGE_TAG}' ..."
          DIGEST=""
          for attempt in 1 2 3 4 5 6; do
            DIGEST=$(chainctl images list \
                       --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
                       --output json 2>/dev/null \
                     | jq -r --arg t "$IMAGE_TAG" \
                         'first(.[0].tags[]? | select(.name == $t) | .digest) // empty')
            [ -n "$DIGEST" ] && break
            echo "  tag '${IMAGE_TAG}' not resolvable yet (attempt $attempt) — retrying in 10s..."
            sleep 10
          done
          if [ -z "$DIGEST" ]; then
            echo "Error: could not resolve digest for tag '${IMAGE_TAG}'." >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved image digest: $DIGEST"

      # ── 3. Verify image is cryptographically signed ──
      - name: Verify image signature (cosign)
        if: steps.customize.outputs.skipped != 'true'
        run: |
          mkdir -p evidence
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }} \
            | jq . > evidence/signature-verify.json
          echo "Signature verified"

      # ── 4. Extract SBOM ──
      - name: Extract SBOM attestation
        if: steps.customize.outputs.skipped != 'true'
        run: |
          cosign verify-attestation \
            --type sbom \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson | .predicate' \
            > evidence/sbom.json
          echo "SBOM extracted: $(jq '.packages | length' evidence/sbom.json) packages"

      # ── 5. Extract SLSA provenance ──
      - name: Extract SLSA provenance
        if: steps.customize.outputs.skipped != 'true'
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson' \
            > evidence/provenance.json
          echo "Provenance extracted"

      # ── 6. Grype scan — fail on critical or high CVEs ──
      - name: Grype vulnerability scan
        if: steps.customize.outputs.skipped != 'true'
        uses: chainguard-actions/anchore-scan-action@5470f64f241ff0b662c1efed80f982517e2340d6 # v7.4.0
        env:
          GRYPE_DB_AUTO_UPDATE: "true"   # default true; v7.4.0 bundles grype
                                         # v0.110 using the current (v6) DB schema
        with:
          image: ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: evidence/grype-results.json

      # ── 7. Copy build config into evidence bundle ──
      - name: Add build config to evidence bundle
        if: steps.customize.outputs.skipped != 'true'
        run: cp "$CONFIG_FILE" "evidence/$(basename "$CONFIG_FILE")"

      # ── 8. Upload evidence bundle as Actions artifact ──
      - name: Upload evidence bundle
        if: steps.customize.outputs.skipped != 'true'
        uses: chainguard-actions/actions-upload-artifact@8dd583ff8251c4a96857f05031036783608a6a96 # v7.0.1
        with:
          name: evidence-bundle-${{ matrix.repo }}-${{ github.sha }}
          retention-days: 90
          path: evidence/

      # ── 9. Update Dockerfile with new pinned digest ──
      - name: Update Dockerfile digest
        if: steps.customize.outputs.skipped != 'true' && env.DOCKERFILE != ''
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          # Only repin the FROM line that references THIS image, so a Dockerfile
          # with multiple cgr.dev bases isn't clobbered.
          sed -i "s|FROM ${IMAGE_REF}\(:[^ @]*\)\?\(@sha256:[a-f0-9]*\)\?|FROM ${IMAGE_REF}:${IMAGE_TAG}@${DIGEST}|" "$DOCKERFILE"
          echo "Updated $DOCKERFILE to digest: $DIGEST"

      - name: Open PR with updated digest
        if: steps.customize.outputs.skipped != 'true' && env.DOCKERFILE != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ${{ matrix.repo }} image digest [${{ github.sha }}]"
          title: "chore: update ${{ matrix.repo }} custom assembly image digest"
          body: |
            Automated digest update from Custom Assembly build.

            **Image:** `${{ env.IMAGE_REF }}:${{ env.IMAGE_TAG }}`
            **Build:** ${{ github.run_id }}
            **Digest:** `${{ steps.build.outputs.digest }}`
            **Grype:** 0 critical, 0 high CVEs ✓
            **Signed:** cosign verified ✓
            **Evidence bundle:** attached to this workflow run (90-day retention)

            Triggered by: change to `${{ env.CONFIG_FILE }}`
          branch: chore/update-${{ matrix.repo }}-digest
          delete-branch: true
