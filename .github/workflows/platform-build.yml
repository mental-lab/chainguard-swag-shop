name: Platform Build — Custom Assembly + Evidence Bundle

on:
  push:
    paths:
      - ca-images-iac/**
      - certs/**
      - .github/workflows/platform-build.yml
  workflow_dispatch:

# Least privilege at the top; each job widens only what it needs.
permissions: {}

env:
  # Global CA certificate directory — scanned for every image build. These are
  # the org's internal/private CAs, applied uniformly, not a per-image setting.
  CERTS_DIR: certs

jobs:
  # ── Discover — build the image matrix from ca-images-iac/<image>/ dirs ──
  # Each image is a directory: ca-images-iac/<repo>/ containing
  #   <repo>.yaml — pure Custom Assembly config (sent to chainctl)
  #   meta.yaml   — build routing (dockerfile)
  # repo and the config path are derived from the directory name; meta.yaml
  # supplies the rest. We read those into a matrix so the build job runs once
  # per image, in parallel. If the Chainguard org/identity isn't configured, or
  # no image dirs exist, we emit an empty matrix and downstream jobs skip.
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Build matrix from ca-images-iac/
        id: set
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Guard — skip gracefully if Chainguard org is not configured.
          # Set CHAINGUARD_ORG and CHAINGUARD_IDENTITY in repo Settings → Variables
          # and configure an assumable OIDC identity in your Chainguard organization.
          if [ -z "${{ vars.CHAINGUARD_ORG }}" ] || [ -z "${{ vars.CHAINGUARD_IDENTITY }}" ]; then
            echo "CHAINGUARD_ORG or CHAINGUARD_IDENTITY not configured — skipping build."
            echo "See: https://edu.chainguard.dev/chainguard/administration/iam-organizations/assumable-ids/identity-examples/github-actions-identity/"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One matrix entry per image directory. repo = directory name,
          # config = <repo>.yaml inside it; dockerfile comes from meta.yaml.
          # Dirs missing either file are warned about and skipped.
          entries=()
          for dir in ca-images-iac/*/; do
            repo=$(basename "$dir")
            meta="${dir}meta.yaml"
            config="${dir}${repo}.yaml"
            if [ ! -f "$meta" ];   then echo "::warning::$dir has no meta.yaml — skipping.";        continue; fi
            if [ ! -f "$config" ]; then echo "::warning::$dir has no ${repo}.yaml — skipping.";      continue; fi
            entries+=( "$(
              yq -o=json -I=0 '{"dockerfile": (.dockerfile // "")}' "$meta" \
                | jq -c --arg repo "$repo" --arg config "$config" '. + {repo: $repo, config: $config}'
            )" )
          done

          if [ ${#entries[@]} -eq 0 ]; then
            echo "No valid image directories under ca-images-iac/ — nothing to build."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INCLUDE=$(printf '%s\n' "${entries[@]}" | jq -s -c '{include: .}')
          echo "Discovered images:"
          echo "$INCLUDE" | jq -r '.include[] | "  - \(.repo)  (\(.config))"'
          echo "matrix=$INCLUDE" >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════════════
  # PHASE 1 — BUILD
  # Apply each image's config (+ certificates) and wait for the async build
  # to finish. This phase only triggers and gates builds; it produces no
  # digest — the published tag is the source of truth, resolved in PHASE 2.
  # ════════════════════════════════════════════════════════════════════
  build:
    name: Build ${{ matrix.repo }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # OIDC auth with chainctl
    strategy:
      fail-fast: false    # one image failing must not cancel the others
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG || 'packetloss.network' }}
      CHAINGUARD_REPO: ${{ matrix.repo }}
      CONFIG_FILE: ${{ matrix.config }}        # pure Custom Assembly config
      # CERTS_DIR is global (workflow-level env), not per-image.

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      # Build the invocation dynamically: start from the image's Custom Assembly
      # config and append one `--with-certificates=<file>` flag per CA certificate
      # found under $CERTS_DIR. `build apply` is async and returns no digest, so
      # we snapshot existing build report IDs to identify the build(s) it triggers.
      - name: Customize image (apply config + certificates)
        id: customize
        run: |
          set -euo pipefail

          ARGS=(
            images repos build apply
            --parent "$CHAINGUARD_ORG"
            --repo   "$CHAINGUARD_REPO"
            --file   "$CONFIG_FILE"
            --yes
          )

          # Discover additional CA certificates and add a flag for each.
          CERT_COUNT=0
          if [ -n "$CERTS_DIR" ] && [ -d "$CERTS_DIR" ]; then
            while IFS= read -r -d '' cert; do
              echo "Adding CA certificate: $cert"
              ARGS+=( "--with-certificates=$cert" )
              CERT_COUNT=$((CERT_COUNT + 1))
            done < <(find "$CERTS_DIR" -type f \
                        \( -iname '*.pem' -o -iname '*.crt' -o -iname '*.cer' -o -iname '*.ca' \) \
                        -print0 | sort -z)
          else
            echo "No certificate directory '${CERTS_DIR:-<none>}' — building without extra CAs."
          fi
          echo "Found $CERT_COUNT additional CA certificate(s)."

          # Snapshot existing report IDs so the wait step can identify this apply's build(s).
          BEFORE_IDS=$(chainctl images repos build list \
            --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
            --output json 2>/dev/null | jq -c '[.reports[].id]')
          echo "before_ids=$BEFORE_IDS" >> "$GITHUB_OUTPUT"

          set +e
          APPLY_OUT=$(chainctl "${ARGS[@]}" 2>&1)
          APPLY_RC=$?
          set -e
          echo "$APPLY_OUT"
          if [ "$APPLY_RC" -ne 0 ]; then
            echo "Error: chainctl build apply exited with code $APPLY_RC." >&2
            exit "$APPLY_RC"
          fi

          if echo "$APPLY_OUT" | grep -q "No changes detected"; then
            echo "Image already up to date — no new build triggered."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # Wait for the triggered build(s) to finish and fail if any did not
      # succeed. Identifies them as report IDs absent before the apply, so
      # concurrent/historical builds don't confuse completion detection.
      - name: Wait for build to complete
        if: steps.customize.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          BEFORE_IDS='${{ steps.customize.outputs.before_ids }}'

          list_reports() {
            chainctl images repos build list \
              --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
              --output json 2>/dev/null
          }

          echo "Waiting for custom build(s) of '$CHAINGUARD_REPO' to complete..."
          DEADLINE=$(( $(date +%s) + 600 ))   # 10 minute budget
          while :; do
            NEW=$(list_reports | jq -c --argjson before "$BEFORE_IDS" \
                    '[.reports[] | select((.id as $i | $before | index($i)) | not)]')
            TOTAL=$(echo "$NEW"   | jq 'length')
            PENDING=$(echo "$NEW" | jq '[.[] | select(.result == null)] | length')
            echo "  triggered reports: total=$TOTAL pending=$PENDING"

            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Error: timed out after 10m waiting for build(s)." >&2
              echo "$NEW" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result // "pending")"' >&2
              exit 1
            fi
            sleep 20
          done

          FAILED=$(echo "$NEW" | jq -c '[.[] | select(.result != "Success")]')
          if [ "$(echo "$FAILED" | jq 'length')" -ne 0 ]; then
            echo "Error: one or more triggered builds of '$CHAINGUARD_REPO' did not succeed:" >&2
            echo "$FAILED" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result)"' >&2
            echo "Log of most recent failed attempt:" >&2
            echo "$FAILED" | jq -r 'sort_by(.completedAt) | last | .log' | tail -c 3000 >&2
            exit 1
          fi
          echo "All triggered builds of '$CHAINGUARD_REPO' completed successfully."

  # ════════════════════════════════════════════════════════════════════
  # CHANGE GATE — did the image the Dockerfile consumes actually change?
  # Resolve the live digest of the consumed tag (the published tag is the
  # source of truth) and compare it to the digest currently pinned in the
  # Dockerfile. If they match, nothing was updated — provenance and
  # update-digest are skipped via their `if:` on this job's `changed` output.
  # ════════════════════════════════════════════════════════════════════
  check:
    name: Check for image changes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # OIDC auth with chainctl
    env:
      DOCKERFILE: Dockerfile
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      digest: ${{ steps.resolve.outputs.digest }}
      repo: ${{ steps.resolve.outputs.repo }}
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      # Parse the Dockerfile's cgr.dev base, resolve the live digest of the tag
      # it consumes, and compare to the digest currently pinned in the FROM line.
      - name: Resolve consumed image digest and detect change
        id: resolve
        run: |
          set -euo pipefail
          if [ ! -f "$DOCKERFILE" ]; then
            echo "Error: '$DOCKERFILE' not found." >&2; exit 1
          fi

          COUNT=$(grep -cE '^[[:space:]]*FROM[[:space:]]+cgr\.dev/' "$DOCKERFILE" || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "Error: no 'FROM cgr.dev/...' line in $DOCKERFILE — nothing to verify." >&2; exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::$DOCKERFILE has $COUNT cgr.dev FROM lines; gating only the first."
          fi

          REF=$(grep -m1 -E '^[[:space:]]*FROM[[:space:]]+cgr\.dev/' "$DOCKERFILE" \
                  | sed -E 's/^[[:space:]]*FROM[[:space:]]+([^[:space:]]+).*/\1/')
          PINNED=$(printf '%s' "$REF" | grep -oE 'sha256:[a-f0-9]+' || true)   # currently pinned (may be empty)
          NO_DIGEST=${REF%@*}            # cgr.dev/org/repo:tag
          IMAGE_REF=${NO_DIGEST%:*}      # cgr.dev/org/repo
          TAG=${NO_DIGEST##*:}           # tag
          if [ "$IMAGE_REF" = "$TAG" ]; then TAG=latest; fi
          P=${IMAGE_REF#cgr.dev/}
          ORG=${P%%/*}
          REPO=${P#*/}
          echo "Consumed image: $IMAGE_REF tag=$TAG (org=$ORG repo=$REPO)"

          DIGEST=""
          for attempt in 1 2 3 4 5 6; do
            DIGEST=$(chainctl images list \
                       --parent "$ORG" --repo "$REPO" --output json 2>/dev/null \
                     | jq -r --arg t "$TAG" \
                         'first(.[0].tags[]? | select(.name == $t) | .digest) // empty')
            [ -n "$DIGEST" ] && break
            echo "  tag '$TAG' not resolvable yet (attempt $attempt) — retrying in 10s..."
            sleep 10
          done
          if [ -z "$DIGEST" ]; then
            echo "Error: could not resolve digest for '$IMAGE_REF:$TAG'." >&2; exit 1
          fi
          echo "Live digest:   $DIGEST"
          echo "Pinned digest: ${PINNED:-<none>}"

          if [ "$DIGEST" = "$PINNED" ]; then
            CHANGED=false
            echo "No change — image already pinned to the live digest. Downstream jobs will be skipped."
          else
            CHANGED=true
            echo "Image changed — provenance and digest update will run."
          fi

          {
            echo "changed=$CHANGED"
            echo "image_ref=$IMAGE_REF"
            echo "tag=$TAG"
            echo "digest=$DIGEST"
            echo "repo=$REPO"
          } >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════════════
  # PHASE 2 — IMAGE PROVENANCE
  # Verify the consumed image: signature, SBOM, SLSA provenance, Grype scan,
  # and an evidence bundle. Runs only when the change gate reports a new digest.
  # ════════════════════════════════════════════════════════════════════
  provenance:
    name: Image provenance
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # OIDC auth with chainctl (registry pulls)
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      - name: Verify image signature (cosign)
        run: |
          mkdir -p evidence
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ needs.check.outputs.image_ref }}@${{ needs.check.outputs.digest }} \
            | jq . > evidence/signature-verify.json
          echo "Signature verified"

      - name: Extract SBOM attestation
        run: |
          cosign verify-attestation \
            --type sbom \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ needs.check.outputs.image_ref }}@${{ needs.check.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson | .predicate' \
            > evidence/sbom.json
          echo "SBOM extracted: $(jq '.packages | length' evidence/sbom.json) packages"

      - name: Extract SLSA provenance
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/chainguard-images" \
            ${{ needs.check.outputs.image_ref }}@${{ needs.check.outputs.digest }} \
            | jq -r '.payload | @base64d | fromjson' \
            > evidence/provenance.json
          echo "Provenance extracted"

      - name: Grype vulnerability scan
        uses: chainguard-actions/anchore-scan-action@5470f64f241ff0b662c1efed80f982517e2340d6 # v7.4.0
        env:
          GRYPE_DB_AUTO_UPDATE: "true"
        with:
          image: ${{ needs.check.outputs.image_ref }}@${{ needs.check.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: evidence/grype-results.json

      - name: Add build config to evidence bundle
        run: |
          CONFIG="ca-images-iac/${{ needs.check.outputs.repo }}/${{ needs.check.outputs.repo }}.yaml"
          [ -f "$CONFIG" ] && cp "$CONFIG" evidence/ || echo "No overlay config found at $CONFIG — skipping."

      - name: Upload evidence bundle
        uses: chainguard-actions/actions-upload-artifact@8dd583ff8251c4a96857f05031036783608a6a96 # v7.0.1
        with:
          name: evidence-bundle-${{ needs.check.outputs.repo }}-${{ github.sha }}
          retention-days: 90
          path: evidence/

  # ════════════════════════════════════════════════════════════════════
  # PHASE 3 — UPDATE DIGEST
  # Pin the Dockerfile's FROM to the verified digest and open a PR. Runs only
  # when the change gate reports a new digest and provenance passed, so a
  # failing Grype scan (or an unchanged image) never produces a PR.
  # ════════════════════════════════════════════════════════════════════
  update-digest:
    name: Update digest
    needs: [check, provenance]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the digest-update branch
      pull-requests: write   # open the PR
    env:
      IMAGE_REF: ${{ needs.check.outputs.image_ref }}
      IMAGE_TAG: ${{ needs.check.outputs.tag }}
      DIGEST: ${{ needs.check.outputs.digest }}
      DOCKERFILE: Dockerfile
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6 # v6.0.2

      - name: Pin Dockerfile digest
        run: |
          set -euo pipefail
          # Repin only the FROM line that references THIS image, so a Dockerfile
          # with multiple cgr.dev bases isn't clobbered.
          sed -i "s|FROM ${IMAGE_REF}\(:[^ @]*\)\?\(@sha256:[a-f0-9]*\)\?|FROM ${IMAGE_REF}:${IMAGE_TAG}@${DIGEST}|" "$DOCKERFILE"
          echo "Updated $DOCKERFILE to digest: $DIGEST"

      - name: Open PR with updated digest
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ${{ needs.check.outputs.repo }} image digest [${{ github.sha }}]"
          title: "chore: update ${{ needs.check.outputs.repo }} custom assembly image digest"
          body: |
            Automated digest update from Custom Assembly build.

            **Image:** `${{ env.IMAGE_REF }}:${{ env.IMAGE_TAG }}`
            **Build:** ${{ github.run_id }}
            **Digest:** `${{ env.DIGEST }}`
            **Grype:** 0 critical, 0 high CVEs ✓
            **Signed:** cosign verified ✓
            **Evidence bundle:** attached to this workflow run (90-day retention)

            Triggered by: change under `ca-images-iac/`
          branch: chore/update-${{ needs.check.outputs.repo }}-digest
          delete-branch: true
