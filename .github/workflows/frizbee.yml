name: Frizbee — Pin Actions to commit SHAs

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  workflows: write   # Allows GITHUB_TOKEN to modify .github/workflows/ files

jobs:
  pin-actions:
    name: Pin GitHub Actions to SHAs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pin Actions refs to SHAs
        uses: stacklok/frizbee-action@v0.0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          actions: .github/workflows
          open_pr: true
          fail_on_unpinned: false
