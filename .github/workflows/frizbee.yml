name: Frizbee — Pin Actions to commit SHAs

on:
  # Manual-only: schedule removed for the demo period — run by hand when
  # actions change, no weekly PR noise.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pin-actions:
    name: Pin GitHub Actions to SHAs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Pin Actions refs to SHAs
        uses: stacklok/frizbee-action@7fb0f7cb0d136c932680249f65eb347c489d3106 # v0.0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          actions: .github/workflows
          open_pr: true
          fail_on_unpinned: false
