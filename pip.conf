[global]
# Chainguard Libraries remediated index first (carries the +cgr.N backported
# builds); the standard Libraries index as fallback — the org's entitlement
# policy (CHAINGUARD_AND_UPSTREAM) serves upstream packages through the same
# endpoint. Auth via ~/.netrc build secret.
index-url = https://libraries.cgr.dev/python-remediated/simple
extra-index-url = https://libraries.cgr.dev/python/simple

[install]
timeout = 30
