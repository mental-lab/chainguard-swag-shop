instructions:
  # Python Flask Application Review
  - name: Python Flask Backend
    fileFilters:
      - "*.py"
      - "!tests/**"
      - "!.venv/**"
    instructions: |
      ## Python Flask Code Review Guidelines

      ### Security & Best Practices
      1. **Secret Management**: Flag any hardcoded secrets, API keys, or credentials (except demo-safe values)
      2. **Flask Security**: Check for proper session configuration, CSRF protection, and input validation
      3. **SQL Injection**: Review database queries for injection vulnerabilities
      4. **Session Handling**: Verify proper session management and secure cookie settings

      ### Code Quality
      1. **PEP 8 Compliance**: Ensure code follows Python style guidelines
      2. **Error Handling**: Check for proper exception handling and logging
      3. **Route Organization**: Review Flask route structure and naming conventions
      4. **Import Management**: Verify clean, organized imports without circular dependencies

      ### Flask-Specific Patterns
      1. **Template Security**: Check Jinja2 templates for XSS vulnerabilities
      2. **Route Design**: Ensure RESTful principles and proper HTTP methods
      3. **Static Generation**: Consider Flask-Frozen compatibility for routes ending in .html
      4. **Session Storage**: Review cart and user data handling in Flask sessions

      ### Performance
      1. **Database Queries**: Look for N+1 query problems and inefficient data access
      2. **Memory Usage**: Check for memory leaks in session or global state
      3. **Caching**: Suggest appropriate caching strategies where applicable

  # Frontend Templates and Static Files
  - name: Frontend Templates and Assets
    fileFilters:
      - "templates/**/*.html"
      - "static/**/*.css"
      - "static/**/*.js"
    instructions: |
      ## Frontend Code Review Guidelines

      ### Security
      1. **XSS Prevention**: Check Jinja2 templates for proper output escaping
      2. **Content Security**: Review inline scripts and external resource loading
      3. **Form Validation**: Ensure client-side validation doesn't replace server-side checks

      ### Accessibility & UX
      1. **Semantic HTML**: Verify proper HTML5 semantic elements
      2. **ARIA Labels**: Check accessibility attributes for screen readers
      3. **Mobile Responsiveness**: Ensure responsive design patterns
      4. **GitLab Branding**: Maintain consistent GitLab visual identity

      ### Template Organization
      1. **DRY Principle**: Check for duplicated template code
      2. **Base Template**: Ensure proper inheritance from base.html
      3. **URL Generation**: Use url_for() instead of hardcoded paths
      4. **Static Assets**: Verify proper static file referencing

  # Configuration and CI/CD Files
  - name: Configuration and DevOps
    fileFilters:
      - ".gitlab-ci.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Makefile"
      - "requirements.txt"
      - ".dockerignore"
      - ".gitignore"
    instructions: |
      ## Configuration & DevOps Review Guidelines

      ### CI/CD Pipeline (.gitlab-ci.yml)
      1. **Security Scanning**: Ensure security jobs (SAST, dependency scanning) are enabled
      2. **Stage Organization**: Maintain emoji-based stage naming convention
      3. **Job Dependencies**: Check proper use of needs/dependencies between jobs
      4. **Artifact Management**: Review artifact expiration and size optimization
      5. **Modern Syntax**: Use 'rules' instead of deprecated 'only/except'

      ### Docker Configuration
      1. **Image Security**: Use official, minimal base images
      2. **Layer Optimization**: Check for efficient layer caching
      3. **Secrets**: Ensure no secrets in Dockerfile or docker-compose
      4. **Port Exposure**: Verify correct port mappings and documentation

      ### Dependencies (requirements.txt)
      1. **Version Pinning**: Check for appropriate version constraints
      2. **Security**: Flag known vulnerable package versions
      3. **Minimal Dependencies**: Question unnecessary or duplicate packages

      ### Build Automation (Makefile)
      1. **Command Safety**: Review for proper error handling and sequential execution
      2. **Documentation**: Ensure help target describes all available commands
      3. **Environment Consistency**: Check virtual environment handling

  # Documentation and Demo Materials
  - name: Documentation and Demo Content
    fileFilters:
      - "README.md"
      - "CLAUDE.md"
      - "RunBooks/**/*.md"
      - "*.md"
    instructions: |
      ## Documentation Review Guidelines

      ### Demo Project Standards
      1. **Demo Context**: Ensure documentation reflects GitLab Duo Platform showcase purpose
      2. **Version Compatibility**: Check GitLab version requirements and demo duration info
      3. **Setup Instructions**: Verify complete, accurate installation and development steps
      4. **Status Warnings**: Maintain appropriate "Work in Progress" and "Not Production Ready" notices

      ### Technical Accuracy
      1. **Command Accuracy**: Verify all code examples and commands are correct and tested
      2. **Port Configuration**: Check Docker run commands include proper port forwarding
      3. **File References**: Ensure all mentioned files and directories exist
      4. **Link Validity**: Verify internal and external links are functional

      ### Presentation Quality
      1. **Professional Tone**: Maintain appropriate tone for GitLab platform demonstrations
      2. **Visual Formatting**: Use consistent markdown formatting and emoji usage
      3. **Completeness**: Check for comprehensive coverage of features and capabilities
      4. **Demo Flow**: Ensure documentation supports 60-minute presentation structure

  # Test Files
  - name: Test Suite
    fileFilters:
      - "tests/**/*.py"
      - "test_*.py"
      - "*_test.py"
    instructions: |
      ## Test Code Review Guidelines

      ### Test Quality
      1. **Coverage**: Ensure new code has appropriate test coverage
      2. **Test Clarity**: Review test names and structure for readability
      3. **Assertions**: Check for meaningful, specific assertions
      4. **Test Data**: Verify use of appropriate test fixtures and mock data

      ### Flask Testing Patterns
      1. **Client Testing**: Use Flask test client for route testing
      2. **Session Testing**: Test cart and session functionality
      3. **Database Testing**: Mock or use test database configurations
      4. **Error Scenarios**: Include negative test cases and error handling

      ### Demo Considerations
      1. **Stable Tests**: Ensure tests are reliable for demo environments
      2. **Performance**: Keep test execution time reasonable for CI/CD demos
      3. **Mock External**: Mock external dependencies like CDN image requests

  # General Files
  - name: General Code Quality
    fileFilters:
      - "**/*"
      - "!node_modules/**"
      - "!.venv/**"
      - "!build/**"
      - "!public/**"
      - "!__pycache__/**"
    instructions: |
      ## General Review Guidelines

      ### GitLab Duo Platform Demo Standards
      1. **Demo Readiness**: Consider impact on 60-minute GitLab platform demonstrations
      2. **Educational Value**: Ensure changes enhance understanding of GitLab features
      3. **Stability**: Prioritize reliable, reproducible behavior for demo environments

      ### Code Organization
      1. **File Structure**: Maintain clean, logical project organization
      2. **Naming Conventions**: Use clear, descriptive names for files and directories
      3. **Dependencies**: Keep external dependencies minimal and well-justified

      ### Approval Requirements
      1. **app.py changes**: Require @noah approval for main application modifications
      2. **.gitlab-ci.yml changes**: Require @lfstucker approval for CI/CD pipeline updates
      3. **Breaking Changes**: Flag any changes that might disrupt demo flow or functionality

      ### Demo Impact Assessment
      1. **Feature Compatibility**: Ensure changes work in both dynamic Flask and static site modes
      2. **Presentation Materials**: Update RunBooks/ if changes affect demo narrative
      3. **Error Handling**: Maintain graceful degradation for demonstration purposes