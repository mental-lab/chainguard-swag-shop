# build.yaml — Chainguard Custom Assembly configuration
#
# This file is versioned alongside the application code.
# It is the single source of truth for which packages are in the
# cgr.dev/packetloss.network/python image.
#
# Changes to this file trigger the platform-build GitHub Actions workflow,
# which rebuilds the image, scans it with Grype, verifies the signature,
# and produces an evidence bundle for audit.
#
# Apply with:
#   chainctl images repos build apply \
#     --parent packetloss.network \
#     --repo python \
#     -f build.yaml \
#     --yes
#
# Note: Custom Certificates require a separate entitlement.
# Contact your Customer Success Team to enable certificate injection.

contents:
  packages:
    # Use the version-agnostic pip so the package resolves against each
    # variant's native Python. Pinning py3.12-pip conflicts with the 3.13+
    # variants this repo builds (both provide cmd:pip3) and fails the build.
    - py3-pip
    - ca-certificates-bundle
